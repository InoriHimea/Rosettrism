[package]
name = "rosettrism"
version = "4.7.3"
edition = "2021"
description = "Rosettrism CLI, server, and library for fetching, caching, aggregating, and decoding lyrics"
license = "MIT"

[lib]
name = "rosettrism"
path = "src/lib.rs"

[[bin]]
name = "rosettrism"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.7"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
des = "0.8"
dialoguer = "0.11"
ego-tree = "0.9"
encoding_rs = "0.8"
flate2 = "1.0"
hex = "0.4"
mime_guess = "2.0"
quick-xml = "0.36"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "cookies", "deflate", "gzip", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rust-embed = "8.5"
scraper = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
tokio = { version = "1.40", features = ["fs", "macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
wiremock = "0.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
